# Modelo de CI/CD da March: "CI por PR, deploy por merge" (regra 15 do processo, cerebro/operacao/processo.md;
# diagnóstico de CI/CD de 17/11/2026). Copie para .github/workflows/ci.yml do projeto e troque cada <...>.
# Exemplos completos: March-Digital/dados (ADRs 0024 e 0025) e March-Digital/site-march (ADRs 0044, 0065 e 0082).
#
# Princípios:
# 1. O PR é o portão e roda tudo que barra. O push na main não testa de novo: só publica a imagem que o PR
#    aprovou e implanta. O merge é o aval.
# 2. A árvore do commit (`git rev-parse HEAD^{tree}`) identifica a imagem: o squash de um PR em dia com a
#    main tem a mesma árvore que o commit que o PR testou. Imagem construída no PR sai como `t-<árvore>`;
#    com tudo verde ganha `ok-<árvore>`; a main só põe a tag do SHA nas imagens `ok-` e implanta. Árvore
#    nova na main (PR que ficou para trás, push direto) roda tudo antes, como um PR.
# 3. Imagem se constrói uma vez, com cache de camadas no GHCR (tag `cache` de cada imagem). Os testes que
#    precisam da imagem (Compose, fumaça) puxam essa, não constroem.
# 4. Verificações de menos de 2 minutos dividem um só runner (job `testes`). Job separado só para o que
#    precisa de ambiente próprio.
# 5. Commit só de documento não abre execução: filtro por caminho igual em push e pull_request. O que o
#    teste confere (os descritivos, pelo `conferir`) fica fora do filtro. As listas mudam juntas.
# 6. Bateria pesada (todos os perfis, visual, Lighthouse) roda uma vez por semana e à mão, nunca no PR.
#    No PR, o navegador roda um perfil só (ADR 0084 do site-march).
#    Paralelismo do Playwright se mede antes de mudar: no site-march, 1 worker venceu 2 e 4 (ADR 0082).
# 7. Job que depende de job pulado precisa de `if` explícito: sem ele o GitHub pula o job quando qualquer
#    antecessor, mesmo indireto, foi pulado (o deploy do dados ficou sem rodar em 17/11/2026 por isso).
# 8. Actions presas por SHA; ferramentas em contêiner presas por digest; imagens base pelo espelho da
#    organização no GHCR (ADR 0047 do site), porque o Docker Hub anônimo limita por IP. Confira as
#    versões antes de copiar.
# Metas do padrão: PR em menos de 5 min; merge até produção em menos de 5 min; a organização dentro
# dos 3.000 min por mês do plano Team.
name: ci

# Documento (docs/, .claude/, .githooks/) não abre execução. Onde o `npm test` confere descritivos .md
# (README.md, CLAUDE.md), eles ficam FORA do filtro; onde .md é só documento, acrescente "!**.md".
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!.claude/**"
      - "!.agents/**"
      - "!.githooks/**"
      - "!skills-lock.json"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!.claude/**"
      - "!.agents/**"
      - "!.githooks/**"
      - "!skills-lock.json"
  schedule:
    - cron: "30 12 * * 1" # segunda, 9h30 em Brasília: bateria pesada, se houve commit na main em 7 dias
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # imagens base do espelho no GHCR

concurrency:
  group: ci-${{ github.ref }}
  # Na main nunca cancela: um deploy interrompido no meio deixaria a VPS pela metade.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRO: ghcr.io/march-digital
  PROJETO: <nome-do-repositorio>        # prefixo das imagens: ghcr.io/march-digital/<projeto>-<nome>
  IMAGENS: <app outra>                  # nomes das imagens, separados por espaço (os mesmos da matriz)

jobs:
  # 1. A árvore do commit identifica a imagem. Se todas as imagens dessa árvore já têm a tag `ok-`,
  #    nada roda de novo (é o caminho curto da main depois de um squash em dia).
  arvore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      arvore: ${{ steps.a.outputs.arvore }}
      aprovada: ${{ steps.a.outputs.aprovada }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: a
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOR: ${{ github.actor }}
        run: |
          arvore=$(git rev-parse 'HEAD^{tree}')
          echo "arvore=$arvore" >> "$GITHUB_OUTPUT"
          echo "$TOKEN" | docker login ghcr.io -u "$ATOR" --password-stdin
          aprovada=true
          for nome in $IMAGENS; do
            docker buildx imagetools inspect "$REGISTRO/$PROJETO-$nome:ok-$arvore" >/dev/null 2>&1 || aprovada=false
          done
          docker logout ghcr.io
          echo "aprovada=$aprovada" >> "$GITHUB_OUTPUT"
          echo "árvore $arvore, aprovada: $aprovada"

  # 2. Imagens construídas UMA vez, uma por runner, com cache de camadas no GHCR. Saem como `t-<árvore>`.
  #    Dockerfile em ordem de cache: dependências antes do código (ADR 0025 do dados).
  construir:
    needs: arvore
    if: needs.arvore.outputs.aprovada != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: <app>, arquivo: <infra/imagem/Dockerfile> }
          # - { nome: <outra>, arquivo: <infra/outra/Dockerfile> }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ${{ matrix.nome }} com cache de camadas no GHCR, marcada pela árvore
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOR: ${{ github.actor }}
          NOME: ${{ matrix.nome }}
          ARQUIVO: ${{ matrix.arquivo }}
          ARVORE: ${{ needs.arvore.outputs.arvore }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ATOR" --password-stdin
          # Construtor em contêiner: o construtor do Docker não exporta cache para registro. O buildkit vem
          # do espelho da organização; o espelho.yml do projeto precisa publicá-lo antes do primeiro run.
          docker buildx create --use --name ci --driver docker-container \
            --driver-opt image=$REGISTRO/espelho-buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          imagem=$REGISTRO/$PROJETO-$NOME
          docker buildx build --push -f "$ARQUIVO" -t "$imagem:t-$ARVORE" \
            --cache-from "type=registry,ref=$imagem:cache" \
            --cache-to "type=registry,ref=$imagem:cache,mode=max" .
          docker logout ghcr.io

  # 3. Um runner para tudo que leva menos de 2 minutos: descritivos, lint, unidade, ponta a ponta leve,
  #    gitleaks. Um checkout, um `npm ci`, um `uv sync`.
  testes:
    needs: arvore
    if: needs.arvore.outputs.aprovada != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # o gitleaks varre todo o histórico
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true          # chaveado pelo uv.lock; apague os passos de uv se não há Python
      - run: npm ci
      - name: Descritivos (processo, regra 14) e unidade em Node
        run: npm test
      - run: uv sync --locked
      - name: Testes Python
        run: uv run pytest
      - name: gitleaks em todo o histórico
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner /repo

  # 4. Testes que precisam de ambiente próprio, um job por ambiente, em paralelo. O Compose usa as imagens
  #    que `construir` publicou (VERSAO = t-<árvore>): o script faz `pull`; sem VERSAO, na máquina, monta.
  compose:
    needs: [arvore, construir]
    if: needs.arvore.outputs.aprovada != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login no GHCR, só leitura
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ATOR" --password-stdin
      - run: <infra/testar-compose.sh>
        env:
          VERSAO: t-${{ needs.arvore.outputs.arvore }}

  # Navegador (só em projeto com páginas): no PR, só o Chrome; no semanal e à mão, todos.
  # playwright.config: fullyParallel: true; retries: 1; sem `workers` até medir (regra 15).
  navegador:
    needs: arvore
    if: needs.arvore.outputs.aprovada != 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
        env: { HOME: /root }
      - run: npx playwright test ${{ github.event_name == 'pull_request' && '--project=chromium' || '' }}
        env: { HOME: /root }
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "playwright-${{ github.run_id }}", path: "playwright-report/\ntest-results/", retention-days: 7 }

  # 6. Bateria pesada só no semanal e à mão: visual, Lighthouse (5 corridas por URL), perfis extras.
  pesados:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "<visual e Lighthouse, copie os passos do site-march>"

  # 6. Tudo verde: as imagens da árvore ganham `ok-<árvore>` (só manifesto). É isso que a main confere.
  aprovar:
    needs: [arvore, testes, compose]   # acrescente `navegador` onde houver
    if: needs.arvore.outputs.aprovada != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Marcar a árvore como aprovada no GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOR: ${{ github.actor }}
          ARVORE: ${{ needs.arvore.outputs.arvore }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ATOR" --password-stdin
          for nome in $IMAGENS; do
            docker buildx imagetools create --tag "$REGISTRO/$PROJETO-$nome:ok-$ARVORE" "$REGISTRO/$PROJETO-$nome:t-$ARVORE"
          done
          docker logout ghcr.io

  # 7. Push na main: NÃO testa de novo. As imagens `ok-<árvore>` ganham a tag do SHA do commit, sem
  #    construir nada, e o deploy puxa por essa tag. Roda tanto no caminho curto (árvore já aprovada, `aprovar`
  #    pulado) quanto no longo (aprovou neste run), por isso o `always()` e a conferência dos resultados.
  imagens:
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (needs.arvore.outputs.aprovada == 'true' || needs.aprovar.result == 'success')
    needs: [arvore, aprovar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Tag do SHA do commit nas imagens aprovadas da árvore
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOR: ${{ github.actor }}
          ARVORE: ${{ needs.arvore.outputs.arvore }}
          SHA: ${{ github.sha }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ATOR" --password-stdin
          for nome in $IMAGENS; do
            docker buildx imagetools create --tag "$REGISTRO/$PROJETO-$nome:$SHA" "$REGISTRO/$PROJETO-$nome:ok-$ARVORE"
          done
          docker logout ghcr.io

  deploy:
    needs: imagens
    # Sem este if o GitHub pula o job quando qualquer antecessor, mesmo indireto, foi pulado (o `aprovar`,
    # no caminho curto). Deploy é um ambiente com um só comando permitido à chave do CI, nunca em paralelo.
    if: ${{ !cancelled() && needs.imagens.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy na VPS (chave restrita ao /opt/<projeto>/bin/deploy)
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSPEDEIRO: ${{ vars.DEPLOY_HOST }}
          USUARIO: ${{ vars.DEPLOY_USER }}
          CONHECIDOS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$CONHECIDOS" > ~/.ssh/known_hosts
          # SHA e token pela entrada padrão: não aparecem na linha de comando da VPS nem nos registros.
          printf '%s\n%s\n' "$SHA" "$TOKEN" \
            | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$USUARIO@$HOSPEDEIRO"
